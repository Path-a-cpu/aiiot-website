              - { name: person, label: 联系人标签, widget: string }
              - { name: address, label: 地址标签, widget: string }
          - label: 页脚
            name: footer
            widget: object
            fields:
              - { name: contact, label: 联系方式标题, widget: string }
              - { name: products, label: 产品标题, widget: string }
