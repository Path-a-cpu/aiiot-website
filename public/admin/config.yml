backend:
  name: github
  repo: Path-a-cpu/aiiot-website
  branch: main
  base_url: https://x-aiiot.com
  auth_endpoint: /oauth/auth

locale: zh_Hans

media_folder: public/images
public_folder: /images

# 产品 / 博客文章 仍用双栏多语言（多条目集合），文案板块改为单语言独立集合
i18n:
  structure: multiple_folders
  locales: [en, zh, de]
  default_locale: zh

# 侧边栏分组：把同一板块的 中/英/德 三个入口收进一个组，避免列表过长
groups:
  - name: site
    label: 网站基础文案
  - name: solutions
    label: 解决方案
  - name: services
    label: 服务与支持
  - name: partners
    label: 合作伙伴
  - name: support
    label: 技术支持

collections:
  # ===================== 网站基础文案 =====================
  - name: site_zh
    label: 中文
    group: site
    files:
      - name: settings
        label: 编辑中文文案
        file: src/content/site/zh/settings.md
        fields:
          - label: 导航栏
            name: nav
            widget: object
            fields:
              - { name: home, label: 首页, widget: string }
              - { name: about, label: 关于我们, widget: string }
              - { name: products, label: 产品中心, widget: string }
              - { name: solutions, label: 解决方案, widget: string }
              - { name: services, label: 服务, widget: string }
              - { name: partners, label: 合作伙伴, widget: string }
              - { name: support, label: 支持, widget: string }
              - { name: contact, label: 联系我们, widget: string }
              - { name: cta, label: 右上角按钮(获取报价), widget: string }
          - label: 产品分类名
            name: cat
            widget: object
            fields:
              - { name: software, label: AI+软件, widget: string }
              - { name: edge, label: AI+边缘计算机, widget: string }
              - { name: sensor, label: AI+传感器, widget: string }
              - { name: connect, label: AI+智能连接, widget: string }
              - { name: auto, label: AI+自动化, widget: string }
          - label: 网站标题与描述(SEO)
            name: hero
            widget: object
            fields:
              - { name: title, label: 网站标题, widget: string }
              - { name: subtitle, label: 网站描述, widget: text }
              - { name: ctaPrimary, label: 主按钮文字, widget: string }
              - { name: ctaSecondary, label: 次按钮文字, widget: string }
          - label: 首页
            name: home
            widget: object
            fields:
              - { name: eyebrow, label: 顶部小标签, widget: string }
              - { name: heroTitle, label: 大标题, widget: string }
              - { name: heroSubtitle, label: 大标题下方描述, widget: text }
              - { name: heroCta1, label: 按钮1文字, widget: string }
              - { name: heroCta2, label: 按钮2文字, widget: string }
              - { name: categoriesTitle, label: 五大产品矩阵标题, widget: string }
              - { name: categoriesSubtitle, label: 副标题, widget: text }
              - { name: viewAll, label: 查看全部产品, widget: string }
              - { name: catDescSoftware, label: 'AI+软件 卡片描述', widget: text }
              - { name: catDescEdge, label: 'AI+边缘计算机 卡片描述', widget: text }
              - { name: catDescSensor, label: 'AI+传感器 卡片描述', widget: text }
              - { name: catDescConnect, label: 'AI+智能连接 卡片描述', widget: text }
              - { name: catDescAuto, label: 'AI+自动化 卡片描述', widget: text }
              - { name: solutionsTitle, label: 行业解决方案标题, widget: string }
              - { name: solutionsSubtitle, label: 副标题, widget: text }
              - label: 行业列表(可增删)
                name: industries
                widget: list
                fields:
                  - { name: label, label: 行业名称, widget: string }
              - { name: statsTitle, label: 数据基石标题, widget: string }
              - label: 数据指标(可增删)
                name: stats
                widget: list
                fields:
                  - { name: value, label: 数值, widget: string }
                  - { name: label, label: 说明文字, widget: string }
              - { name: partnersTitle, label: 合作伙伴标题, widget: string }
              - { name: partnersSubtitle, label: 副标题, widget: text }
              - { name: ctaTitle, label: 底部CTA标题, widget: string }
              - { name: ctaSubtitle, label: 副标题, widget: text }
              - { name: ctaButton, label: 按钮文字, widget: string }
