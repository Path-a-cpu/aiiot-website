  # ===================== 产品 / 博客（保留双栏多语言） =====================
  - name: products
    label: 产品
    folder: src/content/products
    i18n: true
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{title}}"
    fields:
      - label: 产品名称
        name: title
        widget: string
        i18n: true
      - label: 一句话描述
        name: summary
        widget: text
        i18n: true
      - label: 产品图片
        name: image
        widget: image
        required: false
        i18n: duplicate
      - label: 排序
        name: order
        widget: number
        value_type: int
        default: 0
        i18n: duplicate
      - label: 产品分类
        name: category
        widget: select
        i18n: duplicate
        default: software
        options:
          - { label: 'AI+软件', value: 'software' }
          - { label: 'AI+边缘计算机', value: 'edge' }
          - { label: 'AI+传感器', value: 'sensor' }
          - { label: 'AI+智能连接', value: 'connect' }
          - { label: 'AI+自动化', value: 'auto' }
      - label: 详细介绍
        name: body
        widget: markdown
        i18n: true

  - name: posts
    label: 博客文章
    folder: src/content/posts
    i18n: true
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{title}}"
    fields:
      - label: 标题
        name: title
        widget: string
        i18n: true
      - label: 描述
        name: description
        widget: text
        i18n: true
      - label: 发布日期
        name: pubDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        i18n: duplicate
      - label: 作者
        name: author
        widget: string
        required: false
        i18n: duplicate
      - label: 封面图
        name: image
        widget: image
        required: false
        i18n: duplicate
      - label: 正文
        name: body
        widget: markdown
        i18n: true
