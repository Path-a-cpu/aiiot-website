              - { name: feature6Desc, label: 特色6描述, widget: text }
          - label: 通用CTA区块
            name: cta
            widget: object
            fields:
              - { name: title, label: 标题, widget: string }
              - { name: subtitle, label: 副标题, widget: text }
              - { name: button, label: 按钮文字, widget: string }
          - label: 关于我们页
            name: about
