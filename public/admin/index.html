<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiiot 内容管理后台</title>
    <style>
      /* Decap CMS 多语言分栏滚动修复：兼容 CSS-in-JS 生成的类名 */
      html, body, #nc-root {
        height: 100%;
        overflow: hidden;
      }
      /* SplitPane 容器撑满 */
      [class*="SplitPane"] {
        height: 100vh !important;
      }
      /* SplitPane 下的直接子 div（除了 Resizer）就是左右 Pane */
      [class*="SplitPane"] > div:not([class*="Resizer"]) {
        overflow-y: auto !important;
        height: 100% !important;
      }
      [class*="Resizer"] {
        z-index: 10;
        background: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      (function () {
        function fixSplitPaneScroll() {
          // 通过 Resizer 定位 SplitPane，再给它的 pane 子元素加滚动
          document.querySelectorAll('[class*="Resizer"]').forEach(function (resizer) {
            var splitPane = resizer.parentElement;
            if (!splitPane) return;
            Array.from(splitPane.children).forEach(function (child) {
              if (child === resizer) return;
              if (!child.dataset.scrollFixed) {
                child.style.overflowY = 'auto';
                child.style.height = '100%';
                child.dataset.scrollFixed = '1';
              }
            });
          });
        }

        if (window.MutationObserver) {
          var observer = new MutationObserver(fixSplitPaneScroll);
          observer.observe(document.body, { childList: true, subtree: true });
        }
        setInterval(fixSplitPaneScroll, 800);
        fixSplitPaneScroll();

        // 滚轮委托：在当前 SplitPane 的 pane 上滚动
        document.addEventListener(
          'wheel',
          function (e) {
            var pane = e.target.closest && e.target.closest('[class*="SplitPane"] > div:not([class*="Resizer"])');

            // 如果鼠标点在 Resizer 上，找到相邻 pane
            if (!pane) {
              var resizer = e.target.closest && e.target.closest('[class*="Resizer"]');
              if (resizer) {
                var splitPane = resizer.parentElement;
                if (splitPane) {
                  var children = Array.from(splitPane.children).filter(function (c) { return c !== resizer; });
                  pane = children[0];
                }
              }
            }

            if (!pane) return;
            if (pane.scrollHeight <= pane.clientHeight) return;

            var maxScroll = pane.scrollHeight - pane.clientHeight;
            var newTop = pane.scrollTop + e.deltaY;
            if (newTop < 0) newTop = 0;
            if (newTop > maxScroll) newTop = maxScroll;

            if (newTop !== pane.scrollTop) {
              pane.scrollTop = newTop;
              e.preventDefault();
            }
          },
          { passive: false }
        );
      })();
    </script>
  </body>
</html>
