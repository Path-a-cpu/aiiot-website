<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiiot 内容管理后台</title>
    <style>
      /* Decap CMS 多语言分栏滚动修复 */
      html, body, #nc-root {
        height: 100%;
        overflow: hidden;
      }
      [class*="SplitPane"] {
        height: 100vh !important;
      }
      /* SplitPane 下所有直接子 div（面板）都可滚动，Resizer 除外 */
      [class*="SplitPane"] > div {
        overflow-y: auto !important;
        height: 100% !important;
      }
      [class*="SplitPane"] > [class*="Resizer"] {
        overflow: visible !important;
        width: 8px !important;
        background: #e2e8f0 !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      (function () {
        function findPanes() {
          var panes = [];
          document.querySelectorAll('[class*="Resizer"]').forEach(function (resizer) {
            var splitPane = resizer.parentElement;
            if (!splitPane) return;
            Array.from(splitPane.children).forEach(function (child) {
              if (child !== resizer && !child.dataset.scrollFixed) {
                child.style.overflowY = 'auto';
                child.style.height = '100%';
                child.dataset.scrollFixed = '1';
                panes.push(child);
              }
            });
          });
          return panes;
        }

        function getPaneAtPoint(x, y) {
          var resizers = document.querySelectorAll('[class*="Resizer"]');
          for (var i = 0; i < resizers.length; i++) {
            var resizer = resizers[i];
            var splitPane = resizer.parentElement;
            if (!splitPane) continue;
            var children = Array.from(splitPane.children);
            for (var j = 0; j < children.length; j++) {
              var child = children[j];
              if (child === resizer) continue;
              var rect = child.getBoundingClientRect();
              if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                return child;
              }
            }
          }
          return null;
        }

        if (window.MutationObserver) {
          var observer = new MutationObserver(findPanes);
          observer.observe(document.body, { childList: true, subtree: true });
        }
        setInterval(findPanes, 800);
        findPanes();

        document.addEventListener(
          'wheel',
          function (e) {
            var pane = getPaneAtPoint(e.clientX, e.clientY);
            if (!pane) return;

            // 如果 pane 内部还有可滚动子元素且未到底，让默认行为继续
            var style = window.getComputedStyle(pane);
            var scrollable = (style.overflowY === 'auto' || style.overflowY === 'scroll') &&
                             pane.scrollHeight > pane.clientHeight;
            if (!scrollable) return;

            var maxScroll = pane.scrollHeight - pane.clientHeight;
            var newTop = pane.scrollTop + e.deltaY;
            if (newTop < 0) newTop = 0;
            if (newTop > maxScroll) newTop = maxScroll;

            if (newTop !== pane.scrollTop) {
              pane.scrollTop = newTop;
              e.preventDefault();
            }
          },
          { passive: false }
        );
      })();
    </script>
  </body>
</html>
